name: iOS - Produzione App Store

on:
  workflow_dispatch:
    inputs:
      version:
        description: Versione commerciale gia impostata nei target Xcode
        required: true
        type: string
      notes_file:
        description: JSON sotto release-notes/ con le novita per ogni lingua dello store
        required: true
        type: string
      phased_release:
        description: Rilascio graduale Apple di sette giorni dopo approvazione
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: app-store-production
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  NOTES_FILE: ${{ inputs.notes_file }}
  PHASED_RELEASE: ${{ inputs.phased_release }}
  ASC_APP_ID: ${{ vars.ASC_APP_ID }}
  XCODE_CLOUD_WORKFLOW_ID: ${{ vars.XCODE_CLOUD_WORKFLOW_ID }}
  XCODE_CLOUD_MAIN_REF_ID: ${{ vars.XCODE_CLOUD_MAIN_REF_ID }}

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && vars.APP_STORE_PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    env:
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test offline della procedura App Store
        run: python3 -m unittest discover -s ci_scripts -p 'test_*.py' -v
      - name: Validazione dei parametri senza accesso ad Apple
        run: python3 ci_scripts/app_store_release.py validate
      - name: Compilazione su Xcode Cloud e attesa elaborazione Apple
        run: python3 ci_scripts/app_store_release.py prepare
      - name: Riepilogo della build da approvare
        run: cat dist/release-plan.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: app-store-plan-${{ github.sha }}
          path: dist/release-plan.json
          retention-days: 30
          if-no-files-found: error

  production:
    needs: prepare
    # Configure a required reviewer before enabling the workflow.
    environment: app-store-production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: app-store-plan-${{ github.sha }}
          path: dist/
      - name: Invio della build approvata e rilascio automatico dopo revisione
        run: python3 ci_scripts/app_store_release.py submit
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: app-store-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/app-store-receipt.json
          retention-days: 90
          if-no-files-found: ignore
